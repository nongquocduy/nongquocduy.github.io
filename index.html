<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ông Nông</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:Arial;
    background:radial-gradient(circle at top,#0f172a,#000);
    color:white;
    text-align:center;
}

/* logo */
.logo-wrap{
    margin-top:50px;
    position:relative;
    display:inline-block;
}

.logo-wrap::before{
    content:"";
    position:absolute;
    top:-8px;
    left:-8px;
    width:136px;
    height:136px;
    border-radius:50%;
    background:linear-gradient(45deg,#3b82f6,#06b6d4,#8b5cf6,#3b82f6);
    background-size:300% 300%;
    animation:spin 4s linear infinite;
    filter:blur(6px);
}

.logo{
    width:120px;
    border-radius:50%;
    position:relative;
    z-index:1;
}

/* online */
.online{
    position:absolute;
    bottom:10px;
    right:10px;
    width:16px;
    height:16px;
    background:#00ff88;
    border-radius:50%;
    border:3px solid #000;
}

/* title */
.name{
    margin-top:15px;
    font-size:22px;
    font-weight:bold;
    letter-spacing:1px;
}

/* socials */
.socials{
    margin-top:25px;
    display:flex;
    justify-content:center;
    gap:20px;
}

.socials a{
    width:55px;
    height:55px;
    background:#111;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:0.3s;
}

.socials a:hover{
    transform:scale(1.2);
    box-shadow:0 0 20px #3b82f6;
}

.socials img{
    width:26px;
}
</style>
</head>

<body>

<div class="logo-wrap">
    <span class="online"></span>
    <img class="logo" src="https://i.imgur.com/4M34hi2.png">
</div>

<div class="name">Ông Nông</div>

<div class="socials">
    <a href="https://www.facebook.com/ongnong92" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png">
    </a>

    <a href="https://zalo.me/g/gqwno6ujqztfiegkhlhk" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Icon_of_Zalo.svg">
    </a>

    <a href="https://t.me/ongduyspeedios" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png">
    </a>
</div>

</body>
</html>
