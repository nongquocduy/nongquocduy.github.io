<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ông Nông</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#000;
    color:white;
}

/* header */
.header{
    text-align:center;
    padding:20px;
}
.avatar{
    width:120px;
    border-radius:50%;
}
.title{
    font-size:22px;
    margin-top:10px;
}

/* box */
.box{
    margin:10px;
    background:#1a1a1a;
    border-radius:12px;
    overflow:hidden;
}
.menu-title{
    padding:15px;
    cursor:pointer;
}
.menu-content{
    display:none;
    padding:10px;
    background:#111;
}

/* button */
.btn{
    display:block;
    margin:8px 0;
    padding:12px;
    background:#2563eb;
    border-radius:8px;
    text-align:center;
}
</style>
</head>

<body>

<div class="header">
    <div class="title">Speed Ông Nông</div>
    <img class="avatar" src="https://i.imgur.com/4M34hi2.png">
</div>

<!-- AXITAT -->
<div class="box">
    <div class="menu-title" onclick="toggle('m1')">
        ESIGN AXITAT ▼
    </div>

    <div id="m1" class="menu-content">
        <div class="btn" onclick="window.location.href='LINK_CAI_APP'">
            CÀI APP
        </div>

        <div class="btn" onclick="window.location.href='LINK_CERT'">
            TẢI CHỨNG CHỈ
        </div>
    </div>
</div>

<!-- BEIJING -->
<div class="box">
    <div class="menu-title" onclick="toggle('m2')">
        ESIGN BEIJING ▼
    </div>

    <div id="m2" class="menu-content">
        <div class="btn" onclick="window.location.href='LINK_CAI_APP'">
            CÀI APP
        </div>

        <div class="btn" onclick="window.location.href='LINK_CERT'">
            TẢI CHỨNG CHỈ
        </div>
    </div>
</div>

<!-- THANH TOÁN -->
<div class="box">
    <div class="menu-title" onclick="toggle('m3')">
        THANH TOÁN ▼
    </div>

    <div id="m3" class="menu-content">
        <div class="btn" onclick="window.location.href='https://momo.me/abc'">
            MOMO
        </div>

        <div class="btn" onclick="window.location.href='https://yourbank.com'">
            NGÂN HÀNG
        </div>
    </div>
</div>

<script>
function toggle(id){
    let el = document.getElementById(id);
    el.style.display = el.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
