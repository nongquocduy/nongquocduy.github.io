<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ông Nông</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:Arial;
    background:linear-gradient(180deg,#0b1220,#000);
    color:white;
    text-align:center;
}

/* logo banner */
.logo{
    width:90%;
    max-width:400px;
    margin-top:30px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(255,215,0,0.6);
}

/* tên */
.name{
    margin-top:15px;
    font-size:26px;
    font-weight:bold;
    color:#ffd700;
}

/* socials */
.socials{
    margin-top:25px;
    display:flex;
    justify-content:center;
    gap:20px;
}

.socials a{
    width:60px;
    height:60px;
    background:#111;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:0.3s;
}

.socials a:hover{
    transform:scale(1.2);
    background:#ffd700;
    box-shadow:0 0 20px #ffd700;
}

.socials img{
    width:28px;
}
</style>
</head>

<body>

<img class="logo" src="https://raw.githubusercontent.com/nongquocduy/nongquocduy.github.io/main/1B8F2BD2-D167-4EB3-9248-DD448A8BB7B5.PNG">

<div class="name">Ông Nông</div>

<div class="socials">
    <a href="https://www.facebook.com/ongnong92" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png">
    </a>

    <a href="https://zalo.me/g/gqwno6ujqztfiegkhlhk" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Icon_of_Zalo.svg">
    </a>

    <a href="https://t.me/ongduyspeedios" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png">
    </a>
</div>

</body>
</html>
