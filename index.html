<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ông Nông</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#050816;color:white}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:18px 40px;background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);}
.logo{font-size:26px;font-weight:700;background:linear-gradient(90deg,#8b5cf6,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-icons{display:flex;gap:15px}
.icon-btn{width:45px;height:45px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;}
.hero{height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at center,#1e2a78 0%,#050816 70%);}
.avatar{width:140px;height:140px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#06b6d4);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(59,130,246,0.6);}
.name{margin-top:30px;font-size:56px;font-weight:700;display:flex;align-items:center;gap:12px;}
.verify{width:28px;height:28px;background:#3b82f6;border-radius:50%;display:flex;align-items:center;justify-content:center;}
</style>
</head>

<body>

<div class="navbar">
<div class="logo">khoindvn</div>
<div class="nav-icons">
<div class="icon-btn">☀️</div>
<div class="icon-btn">☰</div>
</div>
</div>

<div class="hero">
<div class="avatar">E-Sign</div>
<div class="name">
Ông Nông
<div class="verify">✔</div>
</div>
</div>

</body>
</html>
